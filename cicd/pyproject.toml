[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splunk-cicd"
version = "0.1.0"
description = "Package, vet and deploy Splunk apps to Splunk Cloud through AppInspect and ACS"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
splunk-cicd = "splunk_cicd.cli:main"

[tool.setuptools.packages.find]
include = ["splunk_cicd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
