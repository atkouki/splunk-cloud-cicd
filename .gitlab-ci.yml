stages:
  - validate
  - test
  - deploy

variables:
  APP_DIR: apps/testing_app
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.pip-cache

default:
  image: python:3.12
  cache:
    key: pip
    paths: [.pip-cache]

.tooling: &tooling
  - apt-get update -qq && apt-get install -y -qq libmagic1 >/dev/null
  - pip install -q ./cicd[dev] splunk-appinspect

validate:
  stage: validate
  script:
    - *tooling
    - pytest cicd/tests -q
    - if [ -n "$CI_COMMIT_TAG" ]; then EXPECT="--expect-version $CI_COMMIT_TAG"; fi
    - splunk-cicd package --app "$APP_DIR" --out dist --list $EXPECT
    - splunk-cicd inspect-local --package 'dist/*.tar.gz' --report reports/appinspect-local.json
  artifacts:
    when: always
    paths: [dist/, reports/]
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/

docker-test:
  stage: test
  image: docker:27
  services: [docker:27-dind]
  needs: [validate]
  script:
    - apk add --no-cache bash coreutils
    - cicd/scripts/docker_test.sh dist/*.tar.gz fixtures/access_combined.sample.log
  rules:
    - if: $ENABLE_DOCKER_TEST == "true"

.deploy: &deploy
  stage: deploy
  script:
    - pip install -q ./cicd
    - splunk-cicd deploy --env "envs/$TARGET_ENV.yml" --package 'dist/*.tar.gz' --backup-dir backups --report "reports/deploy-$TARGET_ENV.json"
  artifacts:
    when: always
    paths: [reports/, backups/]
    expire_in: 90 days

deploy-dev:
  <<: *deploy
  needs: [validate]
  variables: { TARGET_ENV: dev }
  environment: { name: dev }
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

deploy-staging:
  <<: *deploy
  needs: [deploy-dev]
  variables: { TARGET_ENV: staging }
  environment: { name: staging }
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      when: manual
      allow_failure: false

deploy-prod:
  <<: *deploy
  needs: [deploy-staging]
  variables: { TARGET_ENV: prod }
  environment: { name: prod }
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      when: manual
      allow_failure: false
